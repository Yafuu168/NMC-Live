<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組織與場地維護 | Yasin Control Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #f1c40f; --bg: #1a1a1a; --card: #262626; --text-dim: #888; }
        body { background: var(--bg); color: white; font-family: "PingFang TC", sans-serif; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 15px; margin-bottom: 25px; }
        .header h2 { margin: 0; color: var(--primary); }
        .add-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #444; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.75em; color: var(--text-dim); }
        input { background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 6px; outline: none; width: 90%; }
        .btn { padding: 10px 20px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
        .btn-primary { background: var(--primary); color: #000; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2d2d2d; color: var(--primary); font-size: 0.85em; }
        .row-locked { color: var(--text-dim); background: rgba(255,255,255,0.02); }
        .row-locked input { background: transparent; border: none; color: var(--text-dim); pointer-events: none; }
        .status-tag { font-size: 0.7em; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-locked { background: #444; color: #aaa; border: 1px solid #555; }
        .tag-open { background: rgba(39, 174, 96, 0.2); color: #27ae60; border: 1px solid #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏫 組織與場地維護</h2>
        <a href="yasin-main.html" style="color: #666; text-decoration: none; font-size: 0.9em;">🏠 返回管理總台</a>
    </div>

    <div class="add-box">
        <div class="input-group"><label>學校全稱</label><input type="text" id="new-name"></div>
        <div class="input-group"><label>校系簡稱</label><input type="text" id="new-short"></div>
        <div class="input-group"><label>入會日期</label><input type="date" id="new-join"></div>
        <div class="input-group"><label>主球場</label><input type="text" id="new-loc"></div>
        <div class="input-group"><label>地圖連結</label><input type="text" id="new-map"></div>
        <button class="btn btn-primary" onclick="addOrg()">確認存檔</button>
    </div>

    <table>
        <thead>
            <tr><th>狀態</th><th>學校全稱</th><th>簡稱</th><th>入會日期</th><th>主球場</th><th>地圖</th></tr>
        </thead>
        <tbody id="org-table-body"></tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'https://eknqdmvmysvctnqeptwf.supabase.co';
    // --- 重要：請在此處填入您目前的 API KEY ---
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbnFkbXZteXN2Y3RucWVwdHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTMxMjgsImV4cCI6MjA5MzY2OTEyOH0.3KHew8yl1v7yqg-gu7TYyJKi9pv5K1AWPwQjKgTBdpc'; 
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchOrgs() {
        const { data, error } = await client.from('nmc_organizations').select('*').order('name');
        if (!error) renderTable(data);
    }

    function renderTable(orgs) {
        const tbody = document.getElementById('org-table-body');
        tbody.innerHTML = '';
        orgs.forEach(o => {
            const isLocked = o.is_locked;
            const tr = document.createElement('tr');
            if (isLocked) tr.className = 'row-locked';
            tr.innerHTML = `
                <td><span class="status-tag ${isLocked ? 'tag-locked' : 'tag-open'}">${isLocked ? '🔒 鎖定' : '🔓 編輯'}</span></td>
                <td><input type="text" value="${o.name}" ${isLocked ? 'readonly' : ''} onchange="updateField('${o.id}', 'name', this.value)"></td>
                <td><input type="text" value="${o.short_name}" ${isLocked ? 'readonly' : ''} onchange="updateField('${o.id}', 'short_name', this.value)"></td>
                <td>${o.join_date || '--'}</td>
                <td><input type="text" value="${o.main_location || ''}" ${isLocked ? 'readonly' : ''} onchange="updateField('${o.id}', 'main_location', this.value)"></td>
                <td>${o.map_url ? `<a href="${o.map_url}" target="_blank" style="color:#3498db">地圖</a>` : '--'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function addOrg() {
        const payload = {
            name: document.getElementById('new-name').value,
            short_name: document.getElementById('new-short').value,
            join_date: document.getElementById('new-join').value || null,
            main_location: document.getElementById('new-loc').value,
            map_url: document.getElementById('new-map').value,
            is_locked: true // 存檔後預設鎖定
        };

        const { error } = await client.from('nmc_organizations').insert([payload]);
        if (error) alert("新增失敗：" + error.message);
        else {
            alert("資料已存檔並鎖定。");
            location.reload();
        }
    }

    async function updateField(id, field, value) {
        const { error } = await client.from('nmc_organizations').update({ [field]: value }).eq('id', id);
        if (error) {
            alert("更新失敗：此資料已被鎖定，無法修改。");
            fetchOrgs();
        }
    }

    fetchOrgs();
</script>
</body>
</html>
