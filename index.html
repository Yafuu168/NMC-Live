<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大數盃壘球經典賽-Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #f1c40f; --bg: #1a1a1a; --card: #262626; --danger: #e74c3c; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        
        /* 標題與傳承區樣式保持一致... */
        .wiki-section { background: var(--card); border-left: 5px solid var(--primary); padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .heritage-section { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 25px; font-size: 0.85em; }

        /* 雙層選擇器 */
        .selector-box { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .label { font-size: 0.8em; color: #888; font-weight: bold; margin-bottom: 8px; display: block; }
        select { width: 100%; padding: 12px; border-radius: 8px; background: #333; color: white; border: 1px solid #444; font-size: 1.1em; margin-bottom: 15px; outline: none; }
        
        .game-meta { background: #1a1a1a; padding: 15px; border-radius: 8px; font-size: 0.85em; border: 1px dashed #444; display: none; }
        .meta-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .meta-val { color: var(--primary); font-weight: bold; }

        /* 入口分流 */
        .nav-grid { display: none; grid-template-columns: 1fr; gap: 10px; margin-top: 20px; }
        .nav-btn { display: flex; align-items: center; background: #2a2a2a; padding: 18px; border-radius: 12px; text-decoration: none; color: white; border-left: 6px solid var(--primary); }
        .btn-admin { border-left-color: var(--danger); background: #2d1f1f; }
        .footer { text-align: center; font-size: 0.75em; color: #444; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <div class="wiki-section">
        <h1>大數盃壘球經典賽-Live</h1>
        <p>「球季年度」傳承系統：錄入與展示歷屆大數盃慢壘賽事之即時數據。</p>
    </div>

    <div class="selector-box">
        <span class="label">📅 選擇球季年度</span>
        <select id="year-select" onchange="filterGames()">
            <option value="">載入年度中...</option>
        </select>

        <div id="match-zone" style="display:none;">
            <span class="label">🥎 選擇比賽場次</span>
            <select id="match-select" onchange="showMatchDetail()">
                <option value="">-- 請選擇場次 --</option>
            </select>
        </div>

        <div id="meta-display" class="game-meta">
            <div class="meta-item"><span>主辦單位：</span><span class="meta-val" id="meta-host">--</span></div>
            <div class="meta-item"><span>場地資訊：</span><span class="meta-val" id="meta-loc">--</span></div>
            <div class="meta-item"><span>開賽日期：</span><span class="meta-val" id="meta-date">--</span></div>
        </div>
    </div>

    <div id="nav-box" class="nav-grid">
        <a href="#" onclick="go('live-board.html')" class="nav-btn"><div><b>📺 即時戰報直播</b></div></a>
        <a href="#" onclick="go('matrix-score.html')" class="nav-btn"><div><b>📊 打擊表現矩陣</b></div></a>
        <a href="#" onclick="go('admin-input.html')" class="nav-btn btn-admin"><div><b>✍️ 紀錄控制台</b></div></a>
    </div>

    <div class="footer">
        NMC Data Engine © 2026<br>
        14年輪一次，是榮譽<span id="secret-gate" style="cursor: pointer;">也</span>是義務。
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://eknqdmvmysvctnqeptwf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbnFkbXZteXN2Y3RucWVwdHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTMxMjgsImV4cCI6MjA5MzY2OTEyOH0.3KHew8yl1v7yqg-gu7TYyJKi9pv5K1AWPwQjKgTBdpc';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allGames = [];

    async function init() {
        const { data } = await client.from('nmc_games').select('*').order('game_date', { ascending: false });
        if (data) {
            allGames = data;
            const years = [...new Set(data.map(g => new Date(g.game_date).getFullYear()))];
            const yearSel = document.getElementById('year-select');
            yearSel.innerHTML = '<option value="">-- 請選擇球季 --</option>';
            years.forEach(y => {
                yearSel.innerHTML += `<option value="${y}">${y} 球季</option>`;
            });
        }
    }

    function filterGames() {
        const selectedYear = document.getElementById('year-select').value;
        const matchZone = document.getElementById('match-zone');
        const matchSel = document.getElementById('match-select');
        const nav = document.getElementById('nav-box');
        const meta = document.getElementById('meta-display');

        nav.style.display = 'none';
        meta.style.display = 'none';

        if (selectedYear) {
            const matches = allGames.filter(g => new Date(g.game_date).getFullYear().toString() === selectedYear);
            matchSel.innerHTML = '<option value="">-- 請選擇場次 --</option>';
            matches.forEach(m => {
                matchSel.innerHTML += `<option value="${m.id}">場次 ${m.match_number || '?'}</option>`;
            });
            matchZone.style.display = 'block';
        } else {
            matchZone.style.display = 'none';
        }
    }

    function showMatchDetail() {
        const id = document.getElementById('match-select').value;
        const meta = document.getElementById('meta-display');
        const nav = document.getElementById('nav-box');

        if (id) {
            const g = allGames.find(x => x.id === id);
            document.getElementById('meta-host').innerText = g.host_school || "大數盃委員會";
            document.getElementById('meta-loc').innerText = g.location;
            document.getElementById('meta-date').innerText = new Date(g.game_date).toLocaleDateString();
            meta.style.display = 'block';
            nav.style.display = 'grid';
        } else {
            meta.style.display = 'none';
            nav.style.display = 'none';
        }
    }

    function go(page) {
        const id = document.getElementById('match-select').value;
        window.location.href = `${page}?game_id=${id}`;
    }

    init();
    
    // 隱藏入口 (秘密雜湊網址邏輯)
    let clicks = 0;
    document.getElementById('secret-gate').addEventListener('click', () => {
        if (++clicks === 5) {
            const p = prompt("管理驗證：");
            if (p === "nmc-boss-2026") window.location.href = "nmc-softball-manager-v2026x9527.html";
        }
    });
</script>
</body>
</html>
