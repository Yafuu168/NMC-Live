<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大數盃壘球經典賽-Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #f1c40f; --bg: #1a1a1a; --card: #262626; --danger: #e74c3c; }
        body { background: var(--bg); color: white; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; margin: 0; padding: 20px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 600px; width: 100%; }
        
        /* 標題區 */
        .wiki-section { background: var(--card); border-left: 5px solid var(--primary); padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .wiki-section h1 { margin: 0 0 10px 0; color: var(--primary); font-size: 1.8em; }
        .wiki-section p { font-size: 0.9em; color: #ccc; margin: 0; }

        /* 14校輪值表 */
        .heritage-section { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 25px; font-size: 0.85em; }
        .heritage-title { color: var(--primary); font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; }
        .heritage-title::before { content: "📜"; margin-right: 8px; }
        .region-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .region-box { background: #222; padding: 8px; border-radius: 5px; text-align: center; font-size: 0.9em; }
        .school-list { list-style: none; padding: 0; margin: 5px 0 0 0; font-size: 0.8em; color: #777; }

        /* 選擇區容器 */
        .selector-box { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .label { font-size: 0.85em; color: #888; font-weight: bold; margin-bottom: 15px; display: block; }
        
        /* 直球對決：直列式卡片樣式 */
        .fast-track { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .season-card {
            background: #2d2d2d;
            border: 1px solid #444;
            border-left: 5px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .season-card:hover {
            background: #363636;
            border-color: var(--primary);
            transform: translateX(5px);
        }
        .card-title { color: var(--primary); font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
        .card-info { font-size: 0.85em; color: #bbb; display: flex; align-items: center; }
        .card-info::before { margin-right: 8px; font-size: 1.1em; }
        .info-host::before { content: "🏫"; }
        .info-loc::before { content: "🏟️"; }

        /* 歷史 LOV 樣式 */
        select { width: 100%; padding: 12px; border-radius: 8px; background: #333; color: white; border: 1px solid #444; font-size: 1em; outline: none; appearance: none; }
        
        .footer { text-align: center; font-size: 0.75em; color: #444; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <div class="wiki-section">
        <h1>大數盃壘球經典賽-Live</h1>
        <p>「全國大專院校數學相關系所盃賽」。直球對決！快速存取近期賽事資訊。</p>
    </div>

    <!-- 傳承牆 -->
    <div class="heritage-section">
        <div class="heritage-title">14 校輪值守則</div>
        <div class="region-group">
            <div class="region-box">北區<ul class="school-list"><li>台大/清交</li><li>師/輔/中原</li></ul></div>
            <div class="region-box">中區<ul class="school-list"><li>逢甲/中興</li><li>東海/靜宜</li></ul></div>
            <div class="region-box">南區<ul class="school-list"><li>成大/中山</li><li>中正/義守</li></ul></div>
        </div>
    </div>

    <div class="selector-box">
        <!-- 快速通行區 -->
        <span class="label">🚀 熱門賽事 (直球對決)</span>
        <div id="fast-track-btns" class="fast-track">
            <!-- 由 JS 動態生成直列卡片 -->
        </div>

        <div style="height: 1px; background: #444; margin: 25px 0;"></div>

        <!-- 歷史區 -->
        <span class="label">📜 歷史球季回顧 (2024以前)</span>
        <select id="year-select" onchange="jumpToSeason(this.value)">
            <option value="">-- 請選擇歷史年份 --</option>
        </select>
    </div>

    <div class="footer">
        NMC Data Engine © 2026<br>
        14年輪一次，是榮譽<span id="secret-gate" style="cursor: pointer;">也</span>是義務。
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://eknqdmvmysvctnqeptwf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbnFkbXZteXN2Y3RucWVwdHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTMxMjgsImV4cCI6MjA5MzY2OTEyOH0.3KHew8yl1v7yqg-gu7TYyJKi9pv5K1AWPwQjKgTBdpc';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    async function init() {
        // 抓取球季(關聯場地)與比賽資訊
        const [resSeasons, resGames] = await Promise.all([
            client.from('nmc_seasons').select('*, nmc_locations(main_name)').order('year', { ascending: false }),
            client.from('nmc_games').select('season_id, host_school')
        ]);

        const seasons = resSeasons.data || [];
        const games = resGames.data || [];
        const fastTrackDiv = document.getElementById('fast-track-btns');
        const yearSel = document.getElementById('year-select');

        seasons.forEach((s, index) => {
            if (index < 2) {
                // 前兩年：生成直列資訊卡片
                const seasonGame = games.find(g => g.season_id === s.id);
                const hostName = seasonGame ? seasonGame.host_school : "資料建檔中";
                const locationName = s.nmc_locations ? s.nmc_locations.main_name : "尚未公佈";

                const card = document.createElement('div');
                card.className = 'season-card';
                card.onclick = () => jumpToSeason(s.id);

                card.innerHTML = `
                    <div class="card-title">${s.year} ${s.name}</div>
                    <div class="card-info info-host">主辦單位：${hostName}</div>
                    <div class="card-info info-loc">主要場地：${locationName}</div>
                `;
                fastTrackDiv.appendChild(card);
            } else {
                // 其餘年份：進入 LOV
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = `${s.year}-${s.name}`;
                yearSel.appendChild(opt);
            }
        });
    }

    function jumpToSeason(id) {
        if (!id) return;
        // 跳轉到年度賽程檢視頁
        window.location.href = `season-view.html?season_id=${id}`;
    }

    init();
    
    // 隱藏入口
    let clicks = 0;
    document.getElementById('secret-gate').addEventListener('click', () => {
        if (++clicks === 5) {
            const p = prompt("管理驗證：");
            if (p === "nmc-boss-2026") window.location.href = "nmc-softball-manager-sabrina.html";
            else clicks = 0;
        }
    });
</script>
</body>
</html>
