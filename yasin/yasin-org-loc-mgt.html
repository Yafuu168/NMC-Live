<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>組織與場地維護 | Yasin Control Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #f1c40f; --bg: #1a1a1a; --card: #262626; --text-dim: #888; --danger: #e74c3c; --success: #27ae60; }
        body { background: var(--bg); color: white; font-family: "PingFang TC", sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 15px; margin-bottom: 25px; }
        .add-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #444; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        input { background: #333; color: white; border: 1px solid #444; padding: 8px; border-radius: 6px; width: 90%; }
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2d2d2d; color: var(--primary); font-size: 0.85em; }
        .row-locked { color: var(--text-dim); background: rgba(255,255,255,0.02); }
        .row-locked input { background: transparent; border: none; color: var(--text-dim); pointer-events: none; }
        .btn-s { padding: 5px 10px; border-radius: 4px; cursor: pointer; border: none; font-size: 0.75em; font-weight: bold; margin-right: 5px; }
        .btn-exit { background: var(--danger); color: white; }
        .btn-save { background: var(--success); color: white; }
        .status-tag { font-size: 0.7em; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .tag-locked { background: #444; color: #aaa; }
        .tag-open { background: rgba(39, 174, 96, 0.2); color: #27ae60; border: 1px solid #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏫 組織與場地維護</h2>
        <a href="yasin-main.html" style="color: #666; text-decoration: none;">🏠 返回管理總台</a>
    </div>

    <div class="add-box">
        <div class="input-group"><label>學校全稱</label><input type="text" id="new-name"></div>
        <div class="input-group"><label>校系簡稱</label><input type="text" id="new-short"></div>
        <div class="input-group"><label>入會日期</label><input type="date" id="new-join"></div>
        <div class="input-group"><label>主球場</label><input type="text" id="new-loc"></div>
        <div class="input-group"><label>地圖連結</label><input type="text" id="new-map"></div>
        <button class="btn-s btn-save" style="height: 38px; font-size: 0.9em;" onclick="addOrg()">確認存檔</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>狀態</th>
                <th>學校全稱</th>
                <th>簡稱</th>
                <th>入會/退出日期</th>
                <th>主球場</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="org-table-body"></tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = 'https://eknqdmvmysvctnqeptwf.supabase.co';
    const SUPABASE_KEY = '您的_ANON_KEY'; 
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchOrgs() {
        const { data, error } = await client.from('nmc_organizations').select('*').order('name');
        if (!error) renderTable(data);
    }

    function renderTable(orgs) {
        const tbody = document.getElementById('org-table-body');
        tbody.innerHTML = '';
        orgs.forEach(o => {
            const isLocked = o.is_locked;
            const tr = document.createElement('tr');
            if (isLocked) tr.className = 'row-locked';
            
            tr.innerHTML = `
                <td><span class="status-tag ${isLocked ? 'tag-locked' : 'tag-open'}">${isLocked ? '🔒 鎖定' : '🔓 編輯'}</span></td>
                <td><input type="text" id="name-${o.id}" value="${o.name}" ${isLocked ? 'readonly' : ''}></td>
                <td><input type="text" id="short-${o.id}" value="${o.short_name}" ${isLocked ? 'readonly' : ''}></td>
                <td style="font-size:0.8em">${o.join_date || '--'} / ${o.leave_date || '現役'}</td>
                <td><input type="text" id="loc-${o.id}" value="${o.main_location || ''}" ${isLocked ? 'readonly' : ''}></td>
                <td>
                    ${!isLocked ? `
                        <button class="btn-s btn-save" onclick="saveAndLock('${o.id}')">送出並鎖定</button>
                        <button class="btn-s btn-exit" onclick="exitLeague('${o.id}')">退出賽事</button>
                    ` : `
                        <span style="font-size:0.7em; color:#555">DB 唯讀</span>
                    `}
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 1. 退出賽事：押日期、鎖定
    async function exitLeague(id) {
        if (!confirm("確定要將此學校設為「退出賽事」嗎？\n這將會押上今日日期並永久鎖定資料。")) return;
        
        const today = new Date().toISOString().split('T')[0];
        const { error } = await client.from('nmc_organizations')
            .update({ leave_date: today, is_locked: true })
            .eq('id', id);

        if (error) alert("操作失敗：" + error.message);
        else location.reload();
    }

    // 2. 修改送出後鎖定
    async function saveAndLock(id) {
        const payload = {
            name: document.getElementById(`name-${id}`).value,
            short_name: document.getElementById(`short-${id}`).value,
            main_location: document.getElementById(`loc-${id}`).value,
            is_locked: true // 送出後重新鎖定
        };

        const { error } = await client.from('nmc_organizations').update(payload).eq('id', id);
        
        if (error) alert("存檔失敗：可能是權限問題或欄位錯誤");
        else {
            alert("修改已成功送出並重新鎖定。");
            location.reload();
        }
    }

    async function addOrg() {
        const payload = {
            name: document.getElementById('new-name').value,
            short_name: document.getElementById('new-short').value,
            join_date: document.getElementById('new-join').value || null,
            main_location: document.getElementById('new-loc').value,
            map_url: document.getElementById('new-map').value,
            is_locked: true 
        };
        const { error } = await client.from('nmc_organizations').insert([payload]);
        if (error) alert("新增失敗"); else location.reload();
    }

    fetchOrgs();
</script>
</body>
</html>
