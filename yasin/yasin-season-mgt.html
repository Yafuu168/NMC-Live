<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>球季年度維護 | Yasin Control Center</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #f1c40f; --bg: #1a1a1a; --card: #262626; --danger: #e74c3c; --success: #27ae60; }
        body { background: var(--bg); color: white; font-family: "PingFang TC", sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 15px; margin-bottom: 25px; }
        .header h2 { margin: 0; color: var(--primary); }

        /* 新增區塊 (LOV 佈局) */
        .add-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.75em; color: #888; }
        input, select { background: #333; color: white; border: 1px solid #444; padding: 10px; border-radius: 6px; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        
        .btn { padding: 10px 20px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; transition: 0.2s; height: 42px; }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { background: #d4af37; }

        /* 表格區塊 */
        table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #2d2d2d; color: var(--primary); font-size: 0.85em; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; }
        .status-open { background: rgba(39, 174, 96, 0.1); color: var(--success); border: 1px solid var(--success); }
        .status-locked { background: rgba(231, 76, 60, 0.1); color: var(--danger); border: 1px solid var(--danger); }

        /* 鎖定邏輯樣式 */
        .row-locked { opacity: 0.6; }
        .row-locked input, .row-locked select { background: transparent; border: none; pointer-events: none; }
        .btn-lock { background: #444; color: white; font-size: 0.75em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🏆 球季年度維護</h2>
        <a href="yasin-main.html" style="color: #666; text-decoration: none; font-size: 0.9em;">🏠 返回管理總台</a>
    </div>

    <!-- 1. 新增球季區塊 (帶入 LOV 選項) -->
    <div class="add-box">
        <div class="input-group">
            <label>西元年度</label>
            <input type="number" id="new-year" placeholder="2026">
        </div>
        <div class="input-group">
            <label>球季名稱</label>
            <input type="text" id="new-name" placeholder="第30屆大數盃">
        </div>
        <div class="input-group">
            <label>主辦學校 (LOV)</label>
            <select id="lov-org">
                <option value="">載入中...</option>
            </select>
        </div>
        <div class="input-group">
            <label>主場地 (LOV)</label>
            <select id="lov-loc">
                <option value="">載入中...</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="addSeason()">新增球季</button>
    </div>

    <!-- 2. 資料清單 -->
    <table>
        <thead>
            <tr>
                <th>年度</th>
                <th>球季名稱</th>
                <th>主辦/場地</th>
                <th>狀態</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="season-table-body">
            <!-- JS 動態載入 -->
        </tbody>
    </table>
</div>

<script>
    // Supabase 初始化 (請確保使用您目前的專案憑證)
    const SUPABASE_URL = 'https://eknqdmvmysvctnqeptwf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVrbnFkbXZteXN2Y3RucWVwdHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTMxMjgsImV4cCI6MjA5MzY2OTEyOH0.3KHew8yl1v7yqg-gu7TYyJKi9pv5K1AWPwQjKgTBdpc';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 啟動：載入 LOV 與列表
    async function initPage() {
        await Promise.all([loadOrgs(), loadLocs()]);
        fetchSeasons();
    }

    // 載入主辦學校 LOV
    async function loadOrgs() {
        const { data } = await client.from('nmc_organizations').select('id, name').order('name');
        const select = document.getElementById('lov-org');
        select.innerHTML = '<option value="">請選擇學校</option>';
        data?.forEach(o => select.innerHTML += `<option value="${o.id}">${o.name}</option>`);
    }

    // 載入主場地 LOV
    async function loadLocs() {
        const { data } = await client.from('nmc_locations').select('id, main_name').order('main_name');
        const select = document.getElementById('lov-loc');
        select.innerHTML = '<option value="">請選擇場地</option>';
        data?.forEach(l => select.innerHTML += `<option value="${l.id}">${l.main_name}</option>`);
    }

    // 抓取球季清單 (包含關聯欄位)
    async function fetchSeasons() {
        const { data: seasons } = await client
            .from('nmc_seasons')
            .select(`
                *,
                nmc_organizations(name),
                nmc_locations(main_name)
            `)
            .order('year', { ascending: false });

        renderTable(seasons || []);
    }

    function renderTable(seasons) {
        const tbody = document.getElementById('season-table-body');
        tbody.innerHTML = '';

        seasons.forEach(s => {
            const isLocked = s.is_locked;
            const tr = document.createElement('tr');
            if (isLocked) tr.className = 'row-locked';

            tr.innerHTML = `
                <td><b>${s.year}</b></td>
                <td>
                    <input type="text" value="${s.name}" 
                        ${isLocked ? 'readonly' : ''} 
                        onchange="updateField('${s.id}', 'name', this.value)">
                </td>
                <td style="font-size: 0.8em; color: #aaa;">
                    ${s.nmc_organizations?.name || '未設'} / ${s.nmc_locations?.main_name || '未設'}
                </td>
                <td>
                    <span class="status-badge ${isLocked ? 'status-locked' : 'status-open'}">
                        ${isLocked ? '🔒 鎖定' : '🔓 開放'}
                    </span>
                </td>
                <td>
                    <button class="btn btn-lock" onclick="toggleLock('${s.id}', ${isLocked})">
                        ${isLocked ? '手動解鎖' : '執行鎖定'}
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 新增球季邏輯
    async function addSeason() {
        const year = document.getElementById('new-year').value;
        const name = document.getElementById('new-name').value;
        const org_id = document.getElementById('lov-org').value;
        const loc_id = document.getElementById('lov-loc').value;

        if (!year || !name) return alert("請完整輸入年度與名稱");

        const { error } = await client.from('nmc_seasons').insert([{ 
            year, name, host_org_id: org_id, main_location_id: loc_id, is_locked: false 
        }]);

        if (error) alert("新增失敗：" + error.message);
        else {
            location.reload(); 
        }
    }

    // 鎖定切換邏輯 (驗證碼：rup eo3ao4)
    async function toggleLock(id, currentStatus) {
        const newState = !currentStatus;
        
        // 如果是要執行「解鎖」
        if (newState === false) { 
            const code = prompt("請輸入管理員授權碼以執行解除鎖定：");
            if (code !== "rup eo3ao4") return alert("授權碼錯誤，無法解鎖");
        }

        const { error } = await client.from('nmc_seasons').update({ is_locked: newState }).eq('id', id);
        if (!error) fetchSeasons();
    }

    // 初始化頁面
    initPage();
</script>
</body>
</html>
